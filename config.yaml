layout:
    gap: 4
    margin_x: 4
    margin_y: 2
    square_size: 9
apps:
    - name: ncmpcpp
      icon: √
      color: "1"
      command: ncmpcpp
      exclusive: false
    - name: lazygit
      icon: ¥
      color: "3"
      command: lazygit
      exclusive: false
    - name: lf
      icon: ≠
      color: "4"
      command: lf
      exclusive: false
    - name: games
      icon: ©
      color: "2"
      command: touch /tmp/.rex-start-es && tmux kill-server
      exclusive: false
    - name: btm
      icon: ↓
      color: "5"
      command: btm
      exclusive: false
    - name: pi
      icon: π
      color: "5"
      command: pi --no-tools
      exclusive: false
      voice: true
    - name: claude
      icon: C
      color: "3"
      command: claude
      exclusive: false
    - name: codex
      icon: X
      color: "2"
      command: codex
      exclusive: false
      voice: true
    - name: ssh
      icon: ≈
      color: "6"
      command: rex menu --ssh
      exclusive: false
ssh_hosts: []
keyboard_mode: front-chorded
stt_mode: companion
