<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Allow uid 1000 (rex user inside the Debian chroot, batocera on the Knulli
  host — same kernel uid) to manage WiFi via ConnMan. Required for `rex wifi`
  to talk to net.connman over the system bus.

  Both user="batocera" and user="rex" are listed because D-Bus resolves the
  sender username from the local /etc/passwd, which differs between the chroot
  (uid 1000 → rex) and the Knulli host (uid 1000 → batocera). Whichever
  passwd file D-Bus consults, one of these will match.
-->
<busconfig>
  <policy user="batocera">
    <allow send_destination="net.connman"/>
    <allow send_interface="net.connman.Agent"/>
    <allow send_interface="net.connman.Counter"/>
    <allow send_interface="net.connman.Notification"/>
  </policy>
  <policy user="rex">
    <allow send_destination="net.connman"/>
    <allow send_interface="net.connman.Agent"/>
    <allow send_interface="net.connman.Counter"/>
    <allow send_interface="net.connman.Notification"/>
  </policy>
</busconfig>
